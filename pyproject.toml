[project]
name = "yalc"
version = "0.3.2"
description = "Yet Another LLM Client"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.71",
    "cachetools>=6.2.6",
    "instructor>=1.14.5",
    "litellm>=1.81.6",
]

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.14",
    "types-cachetools>=6.2.0.20251022",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
plugins = [
    "pydantic.mypy"
]

[tool.ruff]
line-length = 70
